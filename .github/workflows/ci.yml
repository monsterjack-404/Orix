name: ORIX CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source SHA is missing or malformed: $EXPECTED_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Exact-head mismatch: expected $EXPECTED_SHA but checked out $actual"
            exit 1
          fi
          {
            echo "### Exact-head verification"
            printf '%s\n' "- Event: $GITHUB_EVENT_NAME"
            printf '%s\n' "- Expected SHA: $EXPECTED_SHA"
            printf '%s\n' "- Checked-out SHA: $actual"
            printf '%s\n' "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Generate coverage summary
        if: matrix.node-version == 22
        run: npm run test:coverage

  linux-provider-isolation:
    name: Linux Bubblewrap hostile-process isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source SHA is missing or malformed: $EXPECTED_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Exact-head mismatch: expected $EXPECTED_SHA but checked out $actual"
            exit 1
          fi
          {
            echo "### Exact-head verification"
            printf '%s\n' "- Event: $GITHUB_EVENT_NAME"
            printf '%s\n' "- Expected SHA: $EXPECTED_SHA"
            printf '%s\n' "- Checked-out SHA: $actual"
            printf '%s\n' "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build patched Bubblewrap 0.13.1 from checksum-verified upstream source
        env:
          BUBBLEWRAP_VERSION: 0.13.1
          BUBBLEWRAP_SHA256: 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential meson ninja-build pkg-config libcap-dev libselinux1-dev python3-seccomp curl xz-utils
          archive="$RUNNER_TEMP/bubblewrap-${BUBBLEWRAP_VERSION}.tar.xz"
          source_dir="$RUNNER_TEMP/bubblewrap-${BUBBLEWRAP_VERSION}"
          build_dir="$RUNNER_TEMP/bubblewrap-build"
          source_url="https://github.com/containers/bubblewrap/releases/download/v${BUBBLEWRAP_VERSION}/bubblewrap-${BUBBLEWRAP_VERSION}.tar.xz"
          if ! curl --fail --location --retry 3 --retry-delay 1 \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 \
            --output "$archive" "$source_url"; then
            echo "::warning::Official GitHub release asset unavailable; trying Debian's source mirror for the same upstream tarball"
            rm -f "$archive"
            curl --fail --location --retry 3 --retry-delay 1 \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --max-time 180 \
              --output "$archive" \
              "https://deb.debian.org/debian/pool/main/b/bubblewrap/bubblewrap_${BUBBLEWRAP_VERSION}.orig.tar.xz"
          fi
          printf '%s  %s\n' "$BUBBLEWRAP_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -p "$source_dir"
          tar -xJf "$archive" -C "$source_dir" --strip-components=1
          meson setup "$build_dir" "$source_dir" --prefix=/usr/local --buildtype=release
          meson compile -C "$build_dir"
          sudo meson install -C "$build_dir"
          if [ -u /usr/local/bin/bwrap ]; then
            echo "::error::Bubblewrap must not be installed setuid"
            exit 1
          fi
          test "$(/usr/local/bin/bwrap --version)" = "bubblewrap ${BUBBLEWRAP_VERSION}"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Allow Bubblewrap build and installed binaries under Ubuntu AppArmor
        shell: bash
        run: |
          if [ -r /sys/module/apparmor/parameters/enabled ] && grep -q '^Y' /sys/module/apparmor/parameters/enabled; then
            printf '%s\n' \
              'abi <abi/4.0>,' \
              'include <tunables/global>' \
              "profile orix-bwrap-build \"$RUNNER_TEMP/bubblewrap-build/bwrap\" flags=(unconfined) {" \
              '  userns,' \
              '  include if exists <local/bwrap>' \
              '}' \
              'profile orix-bwrap-installed /usr/local/bin/bwrap flags=(unconfined) {' \
              '  userns,' \
              '  include if exists <local/bwrap>' \
              '}' | sudo tee /etc/apparmor.d/orix-bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/orix-bwrap || sudo apparmor_parser -a /etc/apparmor.d/orix-bwrap
          fi
      - name: Run upstream Bubblewrap regression suite
        run: meson test -C "$RUNNER_TEMP/bubblewrap-build" --print-errorlogs
      - name: Diagnose cgroup v2 delegation (read-only)
        run: node scripts/linux-cgroup-v2-preflight.mjs
      - name: Verify Bubblewrap availability
        run: |
          test -x /usr/local/bin/bwrap
          test "$(/usr/local/bin/bwrap --version)" = "bubblewrap 0.13.1"
          /usr/local/bin/bwrap --version
      - name: Run hostile-process and real Rizin checks with delegated cgroup limits
        run: sudo node scripts/linux-isolation-integration.mjs
      - name: Run real cgroup v2 resource-enforcement integration
        run: sudo node scripts/linux-cgroup-v2-integration.mjs

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source SHA is missing or malformed: $EXPECTED_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Exact-head mismatch: expected $EXPECTED_SHA but checked out $actual"
            exit 1
          fi
          {
            echo "### Exact-head verification"
            printf '%s\n' "- Event: $GITHUB_EVENT_NAME"
            printf '%s\n' "- Expected SHA: $EXPECTED_SHA"
            printf '%s\n' "- Checked-out SHA: $actual"
            printf '%s\n' "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
