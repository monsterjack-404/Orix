name: ORIX CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Generate coverage summary
        run: npm run test:coverage

  linux-provider-isolation:
    name: Linux Bubblewrap hostile-process isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Bubblewrap 0.12.0 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git meson ninja-build pkg-config libcap-dev
      - name: Build and install pinned Bubblewrap 0.12.0
        env:
          BWRAP_TAG_OBJECT: 014a04330642e5c870418beb621532cb896e0002
          BWRAP_COMMIT: 2a76602a8c71f36c1527cf9fc3417d9149822e0c
        run: |
          source_dir="$RUNNER_TEMP/bubblewrap-src"
          build_dir="$RUNNER_TEMP/bubblewrap-build"
          git clone --filter=blob:none --no-checkout https://github.com/containers/bubblewrap.git "$source_dir"
          git -C "$source_dir" fetch --depth=1 origin refs/tags/v0.12.0:refs/tags/v0.12.0
          test "$(git -C "$source_dir" rev-parse refs/tags/v0.12.0)" = "$BWRAP_TAG_OBJECT"
          test "$(git -C "$source_dir" rev-parse 'refs/tags/v0.12.0^{commit}')" = "$BWRAP_COMMIT"
          git -C "$source_dir" checkout --detach "$BWRAP_COMMIT"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$BWRAP_COMMIT"
          meson setup "$build_dir" "$source_dir" --prefix=/usr -Dselinux=disabled -Dman=disabled -Dtests=true
          meson compile -C "$build_dir"
          sudo meson install -C "$build_dir"
          test "$(/usr/bin/bwrap --version)" = "bubblewrap 0.12.0"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Allow Bubblewrap user namespaces under Ubuntu AppArmor
        run: |
          if [ -r /sys/module/apparmor/parameters/enabled ] && grep -q '^Y' /sys/module/apparmor/parameters/enabled; then
            {
              printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>'
              printf '%s\n' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}'
              printf 'profile bwrap-ci-build %s/bwrap flags=(unconfined) {\n' "$RUNNER_TEMP/bubblewrap-build"
              printf '%s\n' '  userns,' '  include if exists <local/bwrap>' '}'
            } | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap || sudo apparmor_parser -a /etc/apparmor.d/bwrap
          fi
      - name: Run upstream Bubblewrap 0.12.0 test suite
        run: meson test -C "$RUNNER_TEMP/bubblewrap-build" --print-errorlogs
      - name: Diagnose cgroup v2 delegation (read-only)
        run: node scripts/linux-cgroup-v2-preflight.mjs
      - name: Verify Bubblewrap availability
        run: |
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Run real delegated cgroup v2 hostile-process and resource-isolation checks
        run: sudo node scripts/linux-cgroup-v2-integration.mjs

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Run Windows AppContainer hostile-process isolation checks
        if: runner.os == 'Windows'
        run: node scripts/windows-isolation-integration.mjs
      - name: Run macOS Seatbelt hostile-process isolation checks
        if: runner.os == 'macOS'
        run: node scripts/macos-isolation-integration.mjs
