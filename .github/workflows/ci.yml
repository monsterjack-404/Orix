name: ORIX CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Generate coverage summary
        run: npm run test:coverage

  linux-provider-isolation:
    name: Linux Bubblewrap hostile-process isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Allow Bubblewrap user namespaces under Ubuntu AppArmor
        run: |
          if [ -r /sys/module/apparmor/parameters/enabled ] && grep -q '^Y' /sys/module/apparmor/parameters/enabled; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap || sudo apparmor_parser -a /etc/apparmor.d/bwrap
          fi
      - name: Diagnose cgroup v2 delegation (read-only)
        run: node scripts/linux-cgroup-v2-preflight.mjs
      - name: Verify Bubblewrap availability
        run: |
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Run real delegated cgroup v2 hostile-process and resource-isolation checks
        run: sudo node scripts/linux-cgroup-v2-integration.mjs

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows native launcher twice (compile reproducibility check only)
        if: runner.os == 'Windows'
        run: |
          dotnet clean native/windows-provider-launcher.csproj --configuration Release
          dotnet build native/windows-provider-launcher.csproj --configuration Release --no-incremental --output artifacts/windows-helper-first
          dotnet clean native/windows-provider-launcher.csproj --configuration Release
          dotnet build native/windows-provider-launcher.csproj --configuration Release --no-incremental --output artifacts/windows-helper-second
      - name: Verify Windows launcher build outputs match
        if: runner.os == 'Windows'
        run: |
          $first = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-helper-first/orix-windows-provider-launcher.exe'
          $second = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-helper-second/orix-windows-provider-launcher.exe'
          if (-not (Test-Path -LiteralPath $first -PathType Leaf)) { throw 'First Windows launcher build output is missing' }
          if (-not (Test-Path -LiteralPath $second -PathType Leaf)) { throw 'Second Windows launcher build output is missing' }
          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath $second -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) { throw "Windows launcher builds are not byte-for-byte reproducible: $firstHash != $secondHash" }
          Write-Output "Reproducible Windows launcher SHA-256: $firstHash"
      - name: Upload Windows launcher build artifact (not a runtime trust anchor)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orix-windows-launcher-build
          path: artifacts/windows-helper-first/orix-windows-provider-launcher.exe
          if-no-files-found: error
          retention-days: 7
      - name: Run Windows AppContainer hostile-process isolation checks
        if: runner.os == 'Windows'
        run: node scripts/windows-isolation-integration.mjs
      - name: Run macOS Seatbelt hostile-process isolation checks
        if: runner.os == 'macOS'
        run: node scripts/macos-isolation-integration.mjs
