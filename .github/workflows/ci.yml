name: ORIX CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source SHA is missing or malformed: $EXPECTED_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Exact-head mismatch: expected $EXPECTED_SHA but checked out $actual"
            exit 1
          fi
          {
            echo "### Exact-head verification"
            printf '%s\n' "- Event: $GITHUB_EVENT_NAME"
            printf '%s\n' "- Expected SHA: $EXPECTED_SHA"
            printf '%s\n' "- Checked-out SHA: $actual"
            printf '%s\n' "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Generate coverage summary
        if: matrix.node-version == 22
        run: npm run test:coverage

  linux-provider-isolation:
    name: Linux Bubblewrap hostile-process isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source SHA is missing or malformed: $EXPECTED_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Exact-head mismatch: expected $EXPECTED_SHA but checked out $actual"
            exit 1
          fi
          {
            echo "### Exact-head verification"
            printf '%s\n' "- Event: $GITHUB_EVENT_NAME"
            printf '%s\n' "- Expected SHA: $EXPECTED_SHA"
            printf '%s\n' "- Checked-out SHA: $actual"
            printf '%s\n' "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Allow Bubblewrap user namespaces under Ubuntu AppArmor
        run: |
          if [ -r /sys/module/apparmor/parameters/enabled ] && grep -q '^Y' /sys/module/apparmor/parameters/enabled; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap || sudo apparmor_parser -a /etc/apparmor.d/bwrap
          fi
      - name: Diagnose cgroup v2 delegation (read-only)
        run: node scripts/linux-cgroup-v2-preflight.mjs
      - name: Verify Bubblewrap availability
        run: |
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Run real delegated cgroup v2 hostile-process and resource-isolation checks
        run: sudo env GITHUB_ACTIONS=true ORIX_CGROUP_TEST_ALLOW_ROOT_MUTATION=GITHUB_ACTIONS_DISPOSABLE_VM "$(command -v node)" scripts/linux-cgroup-v2-integration.mjs

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source SHA is missing or malformed: $EXPECTED_SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Exact-head mismatch: expected $EXPECTED_SHA but checked out $actual"
            exit 1
          fi
          {
            echo "### Exact-head verification"
            printf '%s\n' "- Event: $GITHUB_EVENT_NAME"
            printf '%s\n' "- Expected SHA: $EXPECTED_SHA"
            printf '%s\n' "- Checked-out SHA: $actual"
            printf '%s\n' "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
